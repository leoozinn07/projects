services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aquatrip
      MYSQL_USER: aquatrip
      MYSQL_PASSWORD: aquatrip_dev_pw
      MYSQL_ROOT_PASSWORD: aquatrip_root_pw
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - aquatrip_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u aquatrip -paquatrip_dev_pw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aquatrip_mysql_data:
